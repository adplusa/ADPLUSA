# Render Blueprint - Deploy all services
# https://render.com/docs/blueprint-spec

services:
  # Main Next.js Frontend (Public Website)
  - type: web
    name: architect-website
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: architect-cms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_CMS_API_URL
        fromService:
          name: architect-cms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true
    branch: main
    rootDir: ./

  # CMS Backend API (Express + MongoDB)
  - type: web
    name: architect-cms-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    rootDir: cms/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set manually
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set manually
      - key: AWS_BUCKET_NAME
        sync: false  # Set manually
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_CLOUDFRONT_URL
        sync: false  # Set manually (optional)
      - key: CORS_ORIGIN
        value: "*"  # Update with actual frontend URLs after deployment
    autoDeploy: true
    branch: main
    healthCheckPath: /health

  # CMS Admin Frontend (React/Vite - Static Site)
  - type: web
    name: architect-cms-admin
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: cms/frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: architect-cms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
